name: Build NDS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check libnds
        run: |
          if [ -f "$DEVKITPRO/libnds/lib/libnds9.a" ]; then
            echo "libnds already in image"
            exit 0
          fi
          ok=0
          for i in 1 2 3; do
            if dkp-pacman -Sy --noconfirm nds-dev; then ok=1; break; fi
            echo "attempt $i failed, waiting"
            sleep $((i * 20))
          done
          [ "$ok" = 1 ]
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: durak-ds
          path: durak.nds
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: durak.nds
